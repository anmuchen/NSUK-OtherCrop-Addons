[[mods]]
modId="nsukothercropaddons"
version="1.0.0"
displayName="NSUK:其它作物附属"
authors="XiaoLiang小亮"
description='''
NSUK 农田盒作物附属：把「田园调酿！」「茶风·纪事：追叙」「烘焙坊」的作物接给雇佣农民。

收录：
· 田园调酿 —— 卷心菜、玉米、棉花、薄荷、洋葱、马勃菌、辣椒、番茄、向日葵、幽灵死神椒
· 茶风·纪事 —— 辣椒、白菜、茶树（剪刀采茶）；旧存档里的茶风西瓜仍可继续运行（界面已隐藏）
· 烘焙坊 —— 番茄、咖啡、芋头

雇农会把选定区域铺成湿润耕地（箱子里备泥土），不再只在原本有泥土的格子上种。
水渠照常挖：芋头、番茄等普通作物保持原版的水渠灌溉，耕地不会干枯退化。
只有生咖啡豆、茶树、幽灵死神椒、马勃菌不挖水渠；咖啡的耕地由附属定期补湿。
马勃菌只要脚下是完整方块即可，不翻地、不挖水渠，连原来水渠那一列也会种。
箱子里备好对应的种子（以及泥土 / 灵魂土）即可。不收录水稻等需要泡水的作物。
'''

